{% extends "base.html" %}
{% block title %}创建问卷 · 问卷系统{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">STEP 1 · 基本信息</p>
  <h1>创建问卷</h1>
  <p class="muted">创建后会直接进入题目编辑页，继续添加题目和跳转规则。</p>
  <form method="post" action="{{ url_for('surveys.create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="title">问卷标题</label>
    <input id="title" name="title" value="{{ title or '' }}" maxlength="120" required autofocus>
    <label for="description">问卷说明（可选）</label>
    <textarea id="description" name="description" maxlength="1000">{{ description or '' }}</textarea>
    <label class="checkbox-row">
      <input type="checkbox" name="allow_anonymous" value="1" {% if allow_anonymous %}checked{% endif %}>
      允许匿名填写
    </label>
    <p class="muted">不勾选时，填写者打开链接后必须先登录。</p>
    <label class="checkbox-row">
      <input type="checkbox" name="allow_multiple" value="1" {% if allow_multiple %}checked{% endif %}>
      允许同一人重复填写
    </label>
    <p class="muted">不勾选时，同一登录账号或同一匿名会话只能提交一次。</p>
    <button type="submit">创建并开始出题</button>
  </form>
  <p class="muted"><a href="{{ url_for('surveys.index') }}">返回我的问卷</a></p>
</section>
{% endblock %}
