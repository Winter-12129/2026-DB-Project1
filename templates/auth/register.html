{% extends "base.html" %}
{% block title %}注册 · 问卷系统{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>注册账号</h1>
  <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">用户名</label>
    <input id="username" name="username" value="{{ username or '' }}" minlength="3" maxlength="32" required autocomplete="username" autofocus>
    <label for="password">密码</label>
    <input id="password" type="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password">
    <label for="confirm_password">确认密码</label>
    <input id="confirm_password" type="password" name="confirm_password" minlength="8" maxlength="128" required autocomplete="new-password">
    <button type="submit">注册</button>
  </form>
  <p class="muted">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</section>
{% endblock %}
